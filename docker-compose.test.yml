# Test override only: always use a separate -p reminder-test project and test env.
services:
  postgres:
    ports:
      - '127.0.0.1:55432:5432'
  tts-service:
    volumes:
      - ./tests:/srv/tests:ro
    environment:
      E2E_TTS_FAIL: ${E2E_TTS_FAIL:-false}
      E2E_LIVE: ${E2E_LIVE:-false}
      TENANT_ID: ${E2E_TENANT_ID:-fictional-demo}
      RETRY_DELAY_SECONDS: ${E2E_RETRY_DELAY_SECONDS:-300}
    command: [uvicorn, 'tests.e2e_app:create_app', --factory, --host, 0.0.0.0, --port, '8000', --no-access-log]
  n8n:
    volumes:
      - ./.verification:/verification:ro
  smtp-sink:
    image: payment-reminder-mvp-tts-service:local
    volumes:
      - ./tests:/srv/tests:ro
    command: [python, /srv/tests/smtp_sink.py]
    ports:
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8025', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5
