services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: reminder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: reminders
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U reminder -d reminders']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  tts-service:
    image: payment-reminder-mvp-tts-service:local
    build: .
    environment:
      REMINDER_API_KEY: ${REMINDER_API_KEY:?Set a random 32+ character API key}
      DATABASE_URL: postgresql://reminder:${POSTGRES_PASSWORD}@postgres:5432/reminders
      DRY_RUN: ${DRY_RUN:-true}
      TEST_RECIPIENT: ${TEST_RECIPIENT:-preview@example.com}
      TEST_RECIPIENT_VERIFIED: ${TEST_RECIPIENT_VERIFIED:-false}
      SENDER_EMAIL: ${SENDER_EMAIL:-support@example.com}
      VOICE: ${VOICE:-en-US-JennyNeural}
      TTS_PROVIDER: ${TTS_PROVIDER:-edge}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_ALLOWED_VOICES: ${ELEVENLABS_ALLOWED_VOICES:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}
      ELEVENLABS_LANGUAGE_CODE: ${ELEVENLABS_LANGUAGE_CODE:-}
      ELEVENLABS_SPEED: ${ELEVENLABS_SPEED:-0.85}
      ELEVENLABS_STABILITY: ${ELEVENLABS_STABILITY:-0.5}
      ELEVENLABS_SIMILARITY_BOOST: ${ELEVENLABS_SIMILARITY_BOOST:-0.75}
      ALLOWED_VOICES: ${ALLOWED_VOICES:-en-US-JennyNeural,en-US-AriaNeural}
      LANGUAGE: ${LANGUAGE:-en}
      RATE: ${RATE:--15%}
      VOLUME: ${VOLUME:--5%}
      AUDIO_CONVERSION_TIMEOUT_SECONDS: ${AUDIO_CONVERSION_TIMEOUT_SECONDS:-10}
      WHATSAPP_TEST_RECIPIENT: ${WHATSAPP_TEST_RECIPIENT:-}
      WHATSAPP_TEST_RECIPIENT_VERIFIED: ${WHATSAPP_TEST_RECIPIENT_VERIFIED:-false}
      WHATSAPP_CUSTOMER_ROUTING_ENABLED: ${WHATSAPP_CUSTOMER_ROUTING_ENABLED:-false}
      WHATSAPP_WINDOW_SOURCE: ${WHATSAPP_WINDOW_SOURCE:-manual}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      TENANT_ID: ${TENANT_ID:-fictional-demo}
      LEASE_SECONDS: ${LEASE_SECONDS:-600}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      RETRY_DELAY_SECONDS: ${RETRY_DELAY_SECONDS:-300}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  # Optional public ingress. This image serves only health + Meta webhook routes.
  webhook-gateway:
    profiles: [webhook]
    image: payment-reminder-mvp-tts-service:local
    command: [uvicorn, app.webhook_main:create_app, --factory, --host, 0.0.0.0, --port, '8001', --no-access-log, --limit-concurrency, '32', --timeout-keep-alive, '5']
    environment:
      REMINDER_API_KEY: ${REMINDER_API_KEY}
      DATABASE_URL: postgresql://reminder:${POSTGRES_PASSWORD}@postgres:5432/reminders
      TENANT_ID: ${TENANT_ID:-fictional-demo}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  webhook-tunnel:
    profiles: [webhook]
    image: cloudflare/cloudflared:2026.10.0
    command: [tunnel, --no-autoupdate, --metrics, '127.0.0.1:20241', --protocol, http2, --url, 'http://webhook-gateway:8001']
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, '127.0.0.1:20241', ready]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      webhook-gateway:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.6
    ports:
      - '127.0.0.1:5678:5678'
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set a random encryption key}
      REMINDER_API_KEY: ${REMINDER_API_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '24'
      GENERIC_TIMEZONE: Asia/Manila
      TZ: Asia/Manila
      N8N_SECURE_COOKIE: 'false'
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/files/input:ro
      - ./previews:/files/previews
      - ./workflows:/workflows:ro
    depends_on:
      tts-service:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
